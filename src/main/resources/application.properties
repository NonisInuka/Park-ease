spring.application.name=ParkEase

# --- Microsoft SQL Server connection ---
# Override any of these with real environment variables in production;
# the values after ":" are local-dev defaults only.
spring.datasource.url=jdbc:sqlserver://DESKTOP-FG6UCT5;instanceName=SQLEXPRESS;databaseName=vehicleparking;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=Vehicle@12345
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# --- JPA / Hibernate ---
# ddl-auto=update creates/updates tables automatically from the @Entity classes on startup.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Session security ---
# Inactive authenticated sessions expire automatically after 30 minutes.
server.servlet.session.timeout=30m
