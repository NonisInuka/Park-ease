<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout/base :: layout(~{::title}, ~{::main})}"
>
  <head>
    <title>Add Vehicle</title>
  </head>
  <body>
    <main>
      <div class="card max-w-2xl mx-auto">
        <div class="card-header">
          <h4>Add Vehicle</h4>
        </div>
        <div class="card-body">
          <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
          <form th:action="@{/user/vehicles/add}" method="post">
            <div class="form-grid cols-2">
              <div class="form-group">
                <label class="form-label">Plate Number</label>
                <input
                  type="text"
                  name="plateNumber"
                  required
                  placeholder="e.g. AB-1234"
                  class="form-input"
                />
              </div>
              <div class="form-group">
                <label class="form-label">Vehicle Category</label>
                <select name="type" required class="form-select">
                  <option value="">Select Vehicle Category</option>
                  <option th:each="category : ${vehicleCategories.entrySet()}"
                          th:value="${category.key}"
                          th:text="${category.value}">Vehicle Category</option>
                </select>
                <p class="form-hint">Choose the category that best matches this vehicle.</p>
              </div>
              <div class="form-group">
                <label class="form-label">Make</label>
                <input
                  type="text"
                  name="make"
                  required
                  placeholder="e.g. Toyota"
                  class="form-input"
                />
              </div>
              <div class="form-group">
                <label class="form-label">Model</label>
                <input
                  type="text"
                  name="model"
                  required
                  placeholder="e.g. Corolla"
                  class="form-input"
                />
              </div>
              <div class="form-group">
                <label class="form-label">Color</label>
                <input
                  type="text"
                  name="color"
                  required
                  placeholder="e.g. White"
                  class="form-input"
                />
              </div>
              <div class="form-group" style="grid-column: 1 / -1">
                <label class="form-label">Vehicle Image URL (optional)</label>
                <input
                  type="text"
                  name="vehicleUrl"
                  placeholder="https://..."
                  class="form-input"
                />
                <p class="form-hint">
                  Provide a public image URL for your vehicle (optional).
                </p>
              </div>
            </div>
            <div class="form-actions">
              <button type="submit" class="btn btn-primary">
                Save Vehicle
              </button>
              <a th:href="@{/user/vehicles}" class="btn btn-secondary"
                >Cancel</a
              >
            </div>
          </form>
        </div>
      </div>
    </main>
  </body>
</html>
