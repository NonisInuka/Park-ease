<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>Add Zone</title></head>
<body><main>
<div class="card max-w-2xl mx-auto"><div class="card-header"><h4>Add Parking Zone</h4></div><div class="card-body">
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
    <div th:if="${facilities.isEmpty()}" class="alert alert-error">Create a parking facility before adding zones.</div>
    <form th:if="${!facilities.isEmpty()}" th:action="@{/admin/zones/add}" method="post">
        <div class="form-grid cols-2">
            <div class="form-group"><label class="form-label">Facility</label><select class="form-select" name="facilityId" required><option value="">Select Facility</option><option th:each="f : ${facilities}" th:value="${f.facilityId}" th:text="${f.name}">Facility</option></select></div>
            <div class="form-group"><label class="form-label">Zone Name</label><input class="form-input" name="name" required maxlength="100" placeholder="e.g. Zone A" /></div>
            <div class="form-group" style="grid-column:1/-1"><label class="form-label">Floor / Location</label><input class="form-input" name="floor" required maxlength="60" placeholder="e.g. Ground, Level 1, East Wing" /></div>
        </div>
        <div class="form-group"><label class="form-label">Description</label><textarea class="form-textarea" name="description" maxlength="300" rows="3" placeholder="Optional zone details"></textarea></div>
        <div class="form-actions"><button class="btn btn-primary" type="submit">Create Zone</button><a th:href="@{/admin/zones}" class="btn btn-secondary">Cancel</a></div>
    </form>
</div></div>
</main></body></html>
