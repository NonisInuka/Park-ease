<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>Notifications</title></head>
<body><main>
    <div class="page-header">
        <div>
            <h3>Notifications</h3>
            <p>Booking, parking, payment and support updates</p>
        </div>
        <form th:if="${unreadNotificationCount != null and unreadNotificationCount > 0}"
              th:action="@{/notifications/read-all}" method="post">
            <button type="submit" class="btn btn-secondary">Mark All Read</button>
        </form>
    </div>

    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <div th:if="${notifications == null or notifications.isEmpty()}" class="empty-state">
        <div class="empty-state-icon">&#128276;</div>
        <p>No notifications yet.</p>
    </div>

    <div class="notification-list" th:if="${notifications != null and !notifications.isEmpty()}">
        <article th:each="notice : ${notifications}" class="notification-card"
                 th:classappend="${!notice.readFlag} ? ' notification-unread' : ''">
            <div class="notification-main">
                <div class="notification-header">
                    <div class="flex items-center gap-2">
                        <span class="badge badge-info" th:text="${notice.type}">SYSTEM</span>
                        <span th:if="${!notice.readFlag}" class="badge badge-warning">NEW</span>
                    </div>
                    <span class="text-xs text-muted" th:text="${#strings.replace(#strings.substring(notice.createdAt,0,16),'T',' ')}">date</span>
                </div>
                <h4 th:text="${notice.title}">Notification</h4>
                <p class="text-sm" th:text="${notice.message}">Message</p>
                <div class="notification-actions">
                    <a th:if="${notice.link != null and !notice.link.isEmpty()}" th:href="${notice.link}" class="btn btn-primary btn-xs">Open</a>
                    <form th:if="${!notice.readFlag}" th:action="@{/notifications/read/{id}(id=${notice.notificationId})}" method="post">
                        <button type="submit" class="btn btn-ghost btn-xs">Mark Read</button>
                    </form>
                </div>
            </div>
        </article>
    </div>
</main></body></html>
