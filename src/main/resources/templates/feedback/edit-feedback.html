<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>Edit Feedback</title></head>
<body>
<main>
    <div class="card max-w-2xl mx-auto">
        <div class="card-header">
            <h4>Edit Feedback</h4>
        </div>
        <div class="card-body">
            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
            <form th:action="@{/user/feedbacks/update}" method="post">
                <input type="hidden" name="feedbackId" th:value="${feedback.feedbackId}" />
                <div class="form-group">
                    <label class="form-label">Type</label>
                    <select name="type" class="form-select">
                        <option th:selected="${feedback.type == 'FEEDBACK'}">FEEDBACK</option>
                        <option th:selected="${feedback.type == 'COMPLAINT'}">COMPLAINT</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Message</label>
                    <textarea name="message" rows="4" required minlength="10" maxlength="1000" class="form-textarea" th:text="${feedback.message}"></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">Rating</label>
                    <div class="radio-group">
                        <label th:each="i : ${#numbers.sequence(1, 5)}">
                            <input type="radio" name="rating" th:value="${i}" th:checked="${i == feedback.rating}" />
                            <span th:text="${i}"></span>
                        </label>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Update</button>
                    <a th:href="@{/user/feedbacks}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
