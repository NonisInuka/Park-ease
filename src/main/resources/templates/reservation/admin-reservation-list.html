<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>All Reservations</title></head>
<body>
<main>
    <div class="page-header">
        <h3>All Reservations</h3>
    </div>

    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <div class="card filter-card">
        <div class="card-body">
            <form method="get" th:action="@{/admin/reservations}" class="search-filter-form compact-filter-form">
                <div class="form-group">
                    <label class="form-label">Search</label>
                    <input class="form-input" name="q" th:value="${q}" placeholder="Reservation ID, vehicle, slot, date" />
                </div>
                <div class="form-group">
                    <label class="form-label">Status</label>
                    <select class="form-select" name="status">
                        <option value="">All Statuses</option>
                        <option value="ACTIVE" th:selected="${statusFilter == 'ACTIVE'}">Active</option>
                        <option value="COMPLETED" th:selected="${statusFilter == 'COMPLETED'}">Completed</option>
                        <option value="CANCELLED" th:selected="${statusFilter == 'CANCELLED'}">Cancelled</option>
                    </select>
                </div>
                <div class="filter-actions">
                    <button type="submit" class="btn btn-primary">Search</button>
                    <a th:href="@{/admin/reservations}" class="btn btn-secondary">Clear</a>
                </div>
            </form>
        </div>
    </div>

    <div th:if="${reservations == null or reservations.isEmpty()}" class="empty-state">
        <div class="empty-state-icon">&#128197;</div>
        <p>No reservations found.</p>
    </div>

    <div class="feedback-grid">
        <article th:each="res : ${reservations}" class="feedback-card">
            <div class="fb-header">
                <span class="font-mono text-sm" th:text="'#' + ${res.reservationId}"></span>
                <span class="badge"
                      th:classappend="${res.status == 'ACTIVE'} ? 'badge-success' : (${res.status == 'COMPLETED'} ? 'badge-info' : (${res.status == 'CANCELLED'} ? 'badge-danger' : 'badge-neutral'))"
                      th:text="${res.status}"></span>
            </div>
            <div class="fb-meta">
                <span class="text-muted">User </span>
                <span class="font-mono" th:text="${res.userId}"></span>
            </div>
            <div class="fb-message">
                <div class="flex gap-4 mb-2">
                    <span><span class="text-muted">Date:</span> <strong th:text="${res.reservationDate}"></strong></span>
                    <span><span class="text-muted">Time:</span> <strong th:text="${res.startTime}"></strong></span>
                </div>
                <div class="flex gap-4">
                    <span><span class="text-muted">Slot:</span> <strong th:text="${res.slotNumber}"></strong></span>
                    <span><span class="text-muted">Vehicle:</span> <strong class="font-mono" th:text="${res.vehiclePlate}"></strong></span>
                </div>
            </div>
            <div class="fb-actions">
                <form th:if="${res.status == 'COMPLETED' and (session.loggedUser.stakeholderRole == 'ADMINISTRATOR' or session.loggedUser.stakeholderRole == 'OPERATIONS_MANAGER' or session.loggedUser.stakeholderRole == 'FINANCE_OFFICER')}"
                      th:action="@{/admin/bills/generate}" method="post">
                    <input type="hidden" name="reservationId" th:value="${res.reservationId}" />
                    <button type="submit" class="btn btn-primary btn-xs">Generate Bill</button>
                </form>
                <form th:action="@{/admin/reservations/delete/{id}(id=${res.reservationId})}" method="post" class="delete-form">
                    <button type="submit" class="btn btn-danger btn-xs">Delete</button>
                </form>
            </div>
        </article>
    </div>
</main>
</body>
</html>
