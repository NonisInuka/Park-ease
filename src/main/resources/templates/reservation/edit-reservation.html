<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>Edit Reservation</title></head>
<body>
<main>
    <div class="card max-w-2xl mx-auto">
        <div class="card-header">
            <h4>Edit Reservation</h4>
        </div>
        <div class="card-body">
            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
            <form th:action="@{/user/reservations/update}" method="post">
                <input type="hidden" name="reservationId" th:value="${reservation.reservationId}" />
                <div class="form-group">
                    <label class="form-label">Start Time</label>
                    <input type="time" name="startTime" th:value="${reservation.startTime}" required class="form-input" />
                </div>
                <div class="form-group">
                    <label class="form-label">Duration (hours)</label>
                    <input type="number" name="durationHours" th:value="${reservation.durationHours}" min="1" max="24" required class="form-input" />
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Update Reservation</button>
                    <a th:href="@{/user/reservations}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
