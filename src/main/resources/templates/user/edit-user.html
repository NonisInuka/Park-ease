<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>Edit User</title></head>
<body>
<main>
    <div class="card max-w-md mx-auto">
        <div class="card-header">
            <h4>Edit User — <span th:text="${user.name}">User Name</span></h4>
        </div>
        <div class="card-body">
            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
            <form th:action="@{/admin/users/update}" method="post">
                <input type="hidden" name="userId" th:value="${user.userId}" />
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" name="name" th:value="${user.name}" required class="form-input" />
                </div>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" th:value="${user.email}" required class="form-input" />
                </div>
                <div class="form-group">
                    <label class="form-label">Phone</label>
                    <input type="text" name="phone" th:value="${user.phone}" required pattern="[0-9]{10,15}" title="10 to 15 digits, numbers only (e.g. 0771234567)" class="form-input" />
                </div>
                <div class="form-group">
                    <label class="form-label">Stakeholder Role</label>
                    <select name="stakeholderRole" class="form-select">
                        <option th:each="r : ${availableRoles}" th:value="${r}" th:text="${r}"
                                th:selected="${r == user.stakeholderRole}">ROLE</option>
                    </select>
                    <p class="form-hint">Account kind (Administrative vs Driver/Operational) can't be changed here.</p>
                </div>
                <div class="form-group">
                    <label class="form-label">Account Status</label>
                    <select name="status" class="form-select">
                        <option value="ACTIVE" th:selected="${user.status == 'ACTIVE'}">ACTIVE</option>
                        <option value="DISABLED" th:selected="${user.status == 'DISABLED'}">DISABLED</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <a th:href="@{/admin/users}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
