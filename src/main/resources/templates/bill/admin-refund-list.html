<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>Refund Requests</title></head>
<body><main>
    <div class="page-header"><h3>Refund Requests</h3></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div class="mb-4"><a th:href="@{/admin/bills}" class="btn btn-secondary btn-sm">Back to Bills</a></div>
    <div th:if="${refunds == null or refunds.isEmpty()}" class="empty-state"><p>No refund requests found.</p></div>
    <div class="table-wrapper" th:if="${refunds != null and !refunds.isEmpty()}"><table class="table">
        <thead><tr><th>Refund</th><th>Bill</th><th>User</th><th>Amount</th><th>Reason</th><th>Status</th><th>Action</th></tr></thead>
        <tbody><tr th:each="refund : ${refunds}">
            <td class="cell-mono" th:text="${refund.refundId}"></td><td class="cell-mono" th:text="${refund.billId}"></td><td th:text="${refund.userId}"></td>
            <td th:text="'LKR ' + ${#numbers.formatDecimal(refund.amount,0,'COMMA',2,'POINT')}"></td><td th:text="${refund.reason}"></td>
            <td><span class="badge" th:classappend="${refund.status == 'APPROVED'} ? 'badge-success' : (${refund.status == 'REJECTED'} ? 'badge-danger' : 'badge-warning')" th:text="${refund.status}"></span></td>
            <td><form th:if="${refund.status == 'PENDING'}" th:action="@{/admin/refunds/{id}/process(id=${refund.refundId})}" method="post">
                <input type="text" name="adminNote" maxlength="500" class="form-input mb-2" placeholder="Finance note (optional)"/>
                <div class="flex gap-2"><button name="decision" value="APPROVED" class="btn btn-success btn-xs" type="submit">Approve</button><button name="decision" value="REJECTED" class="btn btn-danger btn-xs" type="submit">Reject</button></div>
            </form><span th:if="${refund.status != 'PENDING'}" th:text="${refund.adminNote != null ? refund.adminNote : 'Processed'}"></span></td>
        </tr></tbody></table></div>
</main></body></html>
