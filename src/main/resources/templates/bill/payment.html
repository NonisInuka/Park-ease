<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>Pay Bill</title></head>
<body><main class="max-w-4xl mx-auto">
    <div class="page-header"><h3>Pay Bill</h3></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
    <div class="alert alert-success mb-4">Demo card payment: card data is validated for the transaction but the full card number and CVV are never stored. Use a test card such as Visa 4111111111111111.</div>
    <div class="payment-layout">
        <section class="card payment-summary"><div class="card-header"><h4>Bill Summary</h4></div><div class="card-body">
            <dl class="detail-grid">
                <div class="detail-item"><dt>Bill ID</dt><dd class="mono" th:text="${bill.billId}"></dd></div>
                <div class="detail-item"><dt>Vehicle</dt><dd th:text="${bill.vehiclePlate}"></dd></div>
                <div class="detail-item"><dt>Billable Hours</dt><dd th:text="${bill.durationHours} + ' h'"></dd></div>
                <div class="detail-item"><dt>Amount to Pay</dt><dd class="large text-primary" th:text="'LKR ' + ${#numbers.formatDecimal(bill.finalAmount,0,'COMMA',2,'POINT')}"></dd></div>
            </dl>
        </div></section>
        <section class="card payment-card"><div class="card-header"><h4>Mock Card Payment</h4></div><div class="card-body">
            <form th:action="@{/user/bills/pay/{id}(id=${bill.billId})}" method="post">
                <div class="form-group"><label class="form-label">Card Type</label><div class="payment-options">
                    <label class="payment-option"><input type="radio" name="cardType" value="VISA" required checked/><span>Visa</span></label>
                    <label class="payment-option"><input type="radio" name="cardType" value="MASTER" required/><span>Mastercard</span></label>
                </div></div>
                <div class="form-group"><label class="form-label" for="cardholderName">Name on Card</label><input id="cardholderName" name="cardholderName" type="text" required minlength="2" maxlength="100" class="form-input"/></div>
                <div class="form-group"><label class="form-label" for="cardNumber">Card Number</label><input id="cardNumber" name="cardNumber" type="text" required class="form-input" placeholder="4111111111111111"/></div>
                <div class="form-row">
                    <div class="form-group"><label class="form-label" for="expiryDate">Expiry Date</label><input id="expiryDate" name="expiryDate" type="text" required pattern="(0[1-9]|1[0-2])/[0-9]{2}" class="form-input" placeholder="MM/YY"/></div>
                    <div class="form-group"><label class="form-label" for="cvv">CVV</label><input id="cvv" name="cvv" type="password" required pattern="[0-9]{3,4}" class="form-input" placeholder="123"/></div>
                </div>
                <div class="form-actions"><button type="submit" class="btn btn-success">Submit Payment</button><a th:href="@{/user/bills}" class="btn btn-secondary">Cancel</a></div>
            </form>
        </div></section>
    </div>
</main></body></html>
