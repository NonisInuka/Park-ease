<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>My Refunds</title></head>
<body><main>
    <div class="page-header"><h3>My Refund Requests</h3></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div class="mb-4"><a th:href="@{/user/bills}" class="btn btn-secondary btn-sm">Back to Bills</a></div>
    <div th:if="${refunds == null or refunds.isEmpty()}" class="empty-state"><p>No refund requests yet.</p></div>
    <div class="table-wrapper" th:if="${refunds != null and !refunds.isEmpty()}"><table class="table">
        <thead><tr><th>Refund ID</th><th>Bill</th><th>Amount</th><th>Reason</th><th>Status</th><th>Created</th><th>Finance Note</th></tr></thead>
        <tbody><tr th:each="refund : ${refunds}">
            <td class="cell-mono" th:text="${refund.refundId}"></td><td class="cell-mono" th:text="${refund.billId}"></td>
            <td th:text="'LKR ' + ${#numbers.formatDecimal(refund.amount,0,'COMMA',2,'POINT')}"></td><td th:text="${refund.reason}"></td>
            <td><span class="badge" th:classappend="${refund.status == 'APPROVED'} ? 'badge-success' : (${refund.status == 'REJECTED'} ? 'badge-danger' : 'badge-warning')" th:text="${refund.status}"></span></td>
            <td th:text="${refund.createdAt}"></td><td th:text="${refund.adminNote != null and !refund.adminNote.isEmpty() ? refund.adminNote : '-'}"></td>
        </tr></tbody></table></div>
</main></body></html>
