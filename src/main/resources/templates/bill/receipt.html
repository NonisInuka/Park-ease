<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>Payment Receipt</title></head>
<body><main class="max-w-3xl mx-auto">
    <div class="page-header"><h3>Payment Receipt</h3><button type="button" class="btn btn-secondary" onclick="window.print()">Print Receipt</button></div>
    <div class="card"><div class="card-body">
        <h3 class="mb-4">ParkEase</h3>
        <dl class="detail-grid cols-2">
            <div class="detail-item"><dt>Receipt / Bill ID</dt><dd class="mono" th:text="${bill.billId}"></dd></div>
            <div class="detail-item"><dt>Payment Status</dt><dd><span class="badge badge-success" th:text="${bill.status}"></span></dd></div>
            <div class="detail-item"><dt>Payment Reference</dt><dd class="mono" th:text="${bill.paymentReference != null ? bill.paymentReference : 'Legacy payment'}"></dd></div>
            <div class="detail-item"><dt>Paid At</dt><dd th:text="${bill.paidAt != null ? bill.paidAt : bill.createdDate}"></dd></div>
            <div class="detail-item"><dt>Reservation</dt><dd class="mono" th:text="${bill.reservationId}"></dd></div>
            <div class="detail-item"><dt>Vehicle</dt><dd th:text="${bill.vehiclePlate}"></dd></div>
            <div class="detail-item"><dt>Parking Slot</dt><dd th:text="${bill.slotNumber}"></dd></div>
            <div class="detail-item"><dt>Billable Hours</dt><dd th:text="${bill.durationHours} + ' h'"></dd></div>
            <div class="detail-item"><dt>Rate / Hour</dt><dd th:text="'LKR ' + ${#numbers.formatDecimal(bill.ratePerHour,0,'COMMA',2,'POINT')}"></dd></div>
            <div class="detail-item"><dt>Discount</dt><dd th:text="'LKR ' + ${#numbers.formatDecimal(bill.discount,0,'COMMA',2,'POINT')}"></dd></div>
            <div class="detail-item"><dt>Payment Method</dt><dd th:text="${bill.paymentMethod != null ? bill.paymentMethod : 'CARD'}"></dd></div>
            <div class="detail-item"><dt>Card</dt><dd th:text="${bill.cardLast4 != null ? bill.cardType + ' ending ' + bill.cardLast4 : 'Not recorded for legacy payment'}"></dd></div>
            <div class="detail-item" style="grid-column:1/-1"><dt>Total Paid</dt><dd class="large text-primary" th:text="'LKR ' + ${#numbers.formatDecimal(bill.finalAmount,0,'COMMA',2,'POINT')}"></dd></div>
        </dl>
    </div></div>
    <div class="mt-4"><a th:href="@{/user/bills}" class="btn btn-secondary">Back to My Bills</a></div>
</main></body></html>
