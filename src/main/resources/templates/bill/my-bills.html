<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>My Bills</title></head>
<body>
<main>
    <div class="page-header"><h3>My Bills &amp; Payments</h3></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <div class="flex gap-2 mb-4">
        <a th:href="@{/user/refunds}" class="btn btn-secondary btn-sm">My Refund Requests</a>
    </div>

    <div th:if="${bills == null or bills.isEmpty()}" class="empty-state">
        <div class="empty-state-icon">&#128196;</div><p>You have no bills yet.</p>
    </div>

    <div class="table-wrapper" th:if="${bills != null and !bills.isEmpty()}">
        <table class="table">
            <thead><tr><th>Bill ID</th><th>Date</th><th>Vehicle</th><th>Amount</th><th>Status</th><th>Refund</th><th class="text-right">Actions</th></tr></thead>
            <tbody>
            <tr th:each="bill : ${bills}">
                <td class="cell-mono" th:text="${bill.billId}"></td>
                <td th:text="${bill.createdDate}"></td>
                <td class="cell-mono" th:text="${bill.vehiclePlate}"></td>
                <td class="font-bold" th:text="'LKR ' + ${#numbers.formatDecimal(bill.finalAmount, 0, 'COMMA', 2, 'POINT')}"></td>
                <td><span class="badge"
                    th:classappend="${bill.status == 'PAID'} ? 'badge-success' : (${bill.status == 'UNPAID'} ? 'badge-warning' : (${bill.status == 'REFUNDED'} ? 'badge-info' : 'badge-neutral'))"
                    th:text="${bill.status}"></span></td>
                <td>
                    <span th:if="${refundByBill[bill.billId] != null}" class="badge"
                          th:classappend="${refundByBill[bill.billId].status == 'APPROVED'} ? 'badge-success' : (${refundByBill[bill.billId].status == 'REJECTED'} ? 'badge-danger' : 'badge-warning')"
                          th:text="${refundByBill[bill.billId].status}"></span>
                    <span th:if="${refundByBill[bill.billId] == null}" class="text-muted">-</span>
                </td>
                <td class="text-right"><div class="flex justify-end gap-2">
                    <a th:href="@{/user/bills/{id}(id=${bill.billId})}" class="btn btn-ghost btn-xs">View</a>
                    <a th:if="${bill.status == 'UNPAID'}" th:href="@{/user/bills/pay/{id}(id=${bill.billId})}" class="btn btn-success btn-xs">Pay</a>
                    <a th:if="${bill.status == 'PAID' or bill.status == 'REFUNDED'}" th:href="@{/user/bills/{id}/receipt(id=${bill.billId})}" class="btn btn-secondary btn-xs">Receipt</a>
                    <a th:if="${bill.status == 'PAID' and (refundByBill[bill.billId] == null or refundByBill[bill.billId].status == 'REJECTED')}"
                       th:href="@{/user/refunds/request/{id}(id=${bill.billId})}" class="btn btn-ghost btn-xs">Request Refund</a>
                </div></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
