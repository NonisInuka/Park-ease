<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Reset Password | ParkEase</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
            rel="stylesheet"
        />
        <script th:src="@{/js/theme.js}"></script>
        <link rel="stylesheet" th:href="@{/css/main.css}" />
    </head>
    <body>
        <button
            type="button"
            class="theme-toggle auth-theme-toggle"
            data-theme-toggle
            aria-label="Switch theme"
            aria-pressed="false"
        >
            <span class="theme-toggle-icon" data-theme-icon aria-hidden="true">☾</span>
            <span class="theme-toggle-label" data-theme-label>Dark</span>
        </button>
        <div class="auth-shell cols-2">
            <section class="auth-hero">
                <p class="hero-eyebrow">Account Recovery</p>
                <h1 class="hero-title">
                    Choose a new<br />password.
                </h1>
                <p class="hero-desc">
                    Your new password will be stored securely and used the
                    next time you sign in.
                </p>
            </section>

            <section class="auth-form-panel">
                <div class="auth-card">
                    <p class="auth-eyebrow">Reset Password</p>
                    <h2 class="auth-title">Set a new password</h2>

                    <div th:if="${invalid}" class="alert alert-error mt-4">
                        This reset link is invalid or has expired. Please request a new one.
                    </div>
                    <div th:if="${error}" class="alert alert-error mt-4" th:text="${error}"></div>

                    <form th:if="${token}" th:action="@{/reset-password}" method="post" class="auth-form">
                        <input type="hidden" name="token" th:value="${token}" />
                        <div class="form-group">
                            <label class="form-label">New Password</label>
                            <input
                                type="password"
                                name="password"
                                required
                                minlength="6"
                                placeholder="Minimum 6 characters"
                                class="form-input"
                            />
                            <p class="form-hint">At least 6 characters</p>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Confirm New Password</label>
                            <input
                                type="password"
                                name="confirmPassword"
                                required
                                minlength="6"
                                placeholder="Re-enter the new password"
                                class="form-input"
                            />
                        </div>
                        <button type="submit" class="btn btn-primary w-full mt-2">
                            Update Password
                        </button>
                    </form>

                    <p class="auth-footer">
                        <a th:href="@{/forgot-password}">Request a new link</a>
                        &bull;
                        <a th:href="@{/login}">Back to Sign In</a>
                    </p>
                </div>
            </section>
        </div>
    </body>
</html>
