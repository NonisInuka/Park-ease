<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>My Profile</title></head>
<body>
<main>
    <div class="page-header">
        <div>
            <h3 th:text="${user.name}">Name</h3>
            <span class="badge badge-info" th:text="${user.role}">USER</span>
            <span class="badge badge-neutral" th:if="${user.stakeholderRole}" th:text="${user.stakeholderRole}">STAKEHOLDER ROLE</span>
            <span class="badge" th:classappend="${user.status == 'DISABLED'} ? 'badge-danger' : 'badge-success'" th:text="${user.status ?: 'ACTIVE'}">ACTIVE</span>
        </div>
        <a th:href="@{/user/profile/edit}" class="btn btn-primary">Edit Profile</a>
    </div>

    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <dl class="detail-grid cols-2 max-w-xl">
        <div class="detail-item">
            <dt>Email</dt>
            <dd th:text="${user.email}"></dd>
        </div>
        <div class="detail-item">
            <dt>Phone</dt>
            <dd th:text="${user.phone}"></dd>
        </div>
        <div class="detail-item" style="grid-column: 1 / -1;">
            <dt>User ID</dt>
            <dd class="mono" th:text="${user.userId}"></dd>
        </div>
    </dl>
</main>
</body>
</html>
