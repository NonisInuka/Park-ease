<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout/base :: layout(~{::title}, ~{::main})}"
>
  <head>
    <title>Submit Feedback</title>
  </head>
  <body>
    <main>
      <div class="card max-w-2xl mx-auto">
        <div class="card-header">
          <h4>Submit Feedback</h4>
        </div>
        <div class="card-body">
          <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
          <form th:action="@{/user/feedbacks/submit}" method="post">
            <div class="form-group">
              <label class="form-label">Type</label>
              <select name="type" required class="form-select">
                <option value="">Select Type</option>
                <option value="FEEDBACK" th:selected="${type == 'FEEDBACK'}">FEEDBACK</option>
                <option value="COMPLAINT" th:selected="${type == 'COMPLAINT'}">COMPLAINT</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Message</label>
              <textarea
                name="message"
                rows="4"
                required
                minlength="10"
                maxlength="1000"
                class="form-textarea"
                placeholder="Tell us what's on your mind... (10-1000 characters)"
                th:text="${message}"
              ></textarea>
              <p class="form-hint">10-1000 characters</p>
            </div>
            <div class="form-group">
              <label class="form-label">Rating</label>
              <div class="radio-group">
                <label th:each="i : ${#numbers.sequence(1, 5)}">
                  <input
                    type="radio"
                    name="rating"
                    th:value="${i}"
                    th:checked="${rating != null} ? ${i == rating} : ${i == 3}"
                    required
                  />
                  <span th:text="${i}"></span> ⭐
                </label>
              </div>
            </div>
            <div class="form-actions">
              <button type="submit" class="btn btn-primary">Submit</button>
              <a th:href="@{/user/feedbacks}" class="btn btn-secondary"
                >Cancel</a
              >
            </div>
          </form>
        </div>
      </div>
    </main>
  </body>
</html>
