<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout/base :: layout(~{::title}, ~{::main})}"
>
  <head>
    <title>Book Slot</title>
  </head>
  <body>
    <main>
      <div class="card max-w-3xl mx-auto">
        <div class="card-header">
          <h4>Book a Parking Slot</h4>
        </div>
        <div class="card-body">
          <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
          <form th:action="@{/user/reservations/book}" method="post">
            <div class="form-grid cols-2">
              <div class="form-group">
                <label class="form-label">Vehicle</label>
                <select name="vehiclePlate" required class="form-select">
                  <option value="">Select Vehicle</option>
                  <option
                    th:each="v : ${vehicles}"
                    th:value="${v.plateNumber}"
                    th:text="${v.plateNumber} + ' - ' + ${v.make} + ' (' + ${vehicleCategoryLabels[v.type] != null ? vehicleCategoryLabels[v.type] : v.type} + ')'"
                  ></option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Slot</label>
                <select name="slotId" required class="form-select">
                  <option value="">Select Slot</option>
                  <option
                    th:each="s : ${slots}"
                    th:value="${s.slotId}"
                    th:selected="${preselectedSlotId != null and #strings.equals(preselectedSlotId, s.slotId)}"
                    th:text="${s.slotNumber} + ' (' + ${vehicleCategoryLabels[s.type] != null ? vehicleCategoryLabels[s.type] : s.type} + ' / ' + ${s.spaceCategory} + ') - LKR ' + ${s.ratePerHour} + '/hr'"
                  ></option>
                </select>
                <p class="form-hint">Final availability is confirmed for the exact date/time you choose below. A slot occupied right now may still be reservable for a later non-overlapping time.</p>
              </div>
              <div class="form-group">
                <label class="form-label">Reservation Date</label>
                <input
                  type="date"
                  name="reservationDate"
                  required
                  th:min="${#dates.format(#dates.createNow(), 'yyyy-MM-dd')}"
                  class="form-input"
                />
                <p class="form-hint">Today or future dates only</p>
              </div>
              <div class="form-group">
                <label class="form-label">Start Time</label>
                <input
                  type="time"
                  name="startTime"
                  required
                  placeholder="HH:MM"
                  class="form-input"
                />
              </div>
              <div class="form-group" style="grid-column: 1 / -1">
                <label class="form-label">Duration (hours)</label>
                <input
                  type="number"
                  name="durationHours"
                  min="1"
                  max="24"
                  required
                  placeholder="1-24 hours"
                  class="form-input"
                />
                <p class="form-hint">1-24 hours</p>
              </div>
            </div>
            <div class="form-actions">
              <button type="submit" class="btn btn-primary">
                Confirm Booking
              </button>
              <a th:href="@{/user/reservations}" class="btn btn-secondary"
                >Cancel</a
              >
            </div>
          </form>
        </div>
      </div>
    </main>
  </body>
</html>
