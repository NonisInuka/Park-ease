<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>Resolve Support Ticket</title></head>
<body>
<main>
    <div class="card max-w-2xl mx-auto">
        <div class="card-header">
            <h4>Resolve Support Ticket</h4>
        </div>
        <div class="card-body">
            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
            <p class="text-xs text-muted mb-2" th:text="'From: ' + ${ticket.userName}"></p>
            <p class="text-sm mb-1"><strong th:text="${ticket.subject}"></strong></p>
            <p class="text-sm text-muted mb-4" th:text="${ticket.message}"></p>
            <form th:action="@{/admin/support/resolve}" method="post">
                <input type="hidden" name="ticketId" th:value="${ticket.ticketId}" />
                <div class="form-group">
                    <label class="form-label">Admin Response</label>
                    <textarea name="adminResponse" rows="4" required maxlength="1000" class="form-textarea" placeholder="Write your response... (maximum 1000 characters)" th:text="${adminResponse}"></textarea>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Submit Response</button>
                    <a th:href="@{/admin/support}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
