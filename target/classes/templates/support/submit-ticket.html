<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout/base :: layout(~{::title}, ~{::main})}"
>
  <head>
    <title>Submit Support Request</title>
  </head>
  <body>
    <main>
      <div class="card max-w-2xl mx-auto">
        <div class="card-header">
          <h4>Submit Support Request</h4>
        </div>
        <div class="card-body">
          <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
          <form th:action="@{/user/support/submit}" method="post">
            <div class="form-group">
              <label class="form-label">Subject</label>
              <input
                type="text"
                name="subject"
                th:value="${subject}"
                required
                maxlength="100"
                class="form-input"
                placeholder="Briefly describe the issue"
              />
            </div>
            <div class="form-group">
              <label class="form-label">Message</label>
              <textarea
                name="message"
                rows="5"
                required
                minlength="10"
                maxlength="1000"
                class="form-textarea"
                placeholder="Describe what you need help with... (10-1000 characters)"
                th:text="${message}"
              ></textarea>
              <p class="form-hint">10-1000 characters</p>
            </div>
            <div class="form-actions">
              <button type="submit" class="btn btn-primary">Submit</button>
              <a th:href="@{/user/support}" class="btn btn-secondary"
                >Cancel</a
              >
            </div>
          </form>
        </div>
      </div>
    </main>
  </body>
</html>
