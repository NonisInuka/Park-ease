<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>Edit Facility</title></head>
<body><main>
    <div class="card max-w-2xl mx-auto">
        <div class="card-header"><h4>Edit Parking Facility</h4></div>
        <div class="card-body">
            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
            <form th:action="@{/admin/facilities/update}" method="post">
                <input type="hidden" name="facilityId" th:value="${facility.facilityId}" />
                <div class="form-grid cols-2">
                    <div class="form-group">
                        <label class="form-label">Facility Name</label>
                        <input class="form-input" name="name" th:value="${facility.name}" required maxlength="120" />
                    </div>
                    <div class="form-group">
                        <label class="form-label">Status</label>
                        <select class="form-select" name="status" required>
                            <option value="ACTIVE" th:selected="${facility.status == 'ACTIVE'}">ACTIVE</option>
                            <option value="INACTIVE" th:selected="${facility.status == 'INACTIVE'}">INACTIVE</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Address</label>
                    <input class="form-input" name="address" th:value="${facility.address}" required maxlength="255" />
                </div>
                <div class="form-group">
                    <label class="form-label">Description</label>
                    <textarea class="form-textarea" name="description" maxlength="500" rows="4" th:text="${facility.description}"></textarea>
                </div>
                <div class="form-actions">
                    <button class="btn btn-primary" type="submit">Update Facility</button>
                    <a th:href="@{/admin/facilities}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</main></body></html>
