<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>Parking Zones</title></head>
<body><main>
    <div class="page-header">
        <div><h3>Parking Zones</h3><p>Organize parking spaces by facility and floor</p></div>
        <div class="flex items-center gap-4">
            <a th:href="@{/admin/facilities}" class="btn btn-secondary">Facilities</a>
            <a th:href="@{/admin/zones/add}" class="btn btn-primary">Add Zone</a>
        </div>
    </div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${zones.isEmpty()}" class="empty-state"><div class="empty-state-icon">&#x1F5FA;</div><p>No parking zones yet.</p></div>
    <div th:if="${!zones.isEmpty()}" class="card">
        <div class="card-body no-padding table-wrapper">
            <table class="table">
                <thead><tr><th>Zone</th><th>Facility</th><th>Floor / Location</th><th>Status</th><th class="text-right">Actions</th></tr></thead>
                <tbody>
                <tr th:each="zone : ${zones}">
                    <td><strong th:text="${zone.name}">Zone A</strong></td>
                    <td th:text="${facilityNames[zone.facilityId] ?: 'Unknown Facility'}">Facility</td>
                    <td th:text="${zone.floor}">Ground</td>
                    <td><span class="badge" th:classappend="${zone.status == 'ACTIVE'} ? 'badge-success' : 'badge-warning'" th:text="${zone.status}">ACTIVE</span></td>
                    <td class="text-right"><div class="flex items-center justify-end gap-2">
                        <a th:href="@{/admin/zones/edit/{id}(id=${zone.zoneId})}" class="btn btn-primary btn-sm">Edit</a>
                        <form th:action="@{/admin/zones/delete/{id}(id=${zone.zoneId})}" method="post" class="delete-form"><button class="btn btn-danger btn-sm" type="submit">Delete</button></form>
                    </div></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main></body></html>
