<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>Users</title></head>
<body>
<main>
    <div class="page-header">
        <div>
            <h3>All Users</h3>
            <p th:text="${#lists.size(users)} + ' total users'">0 total users</p>
        </div>
        <a th:href="@{/admin/users/add}" class="btn btn-primary">Add User</a>
    </div>

    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <div class="card filter-card">
        <div class="card-body">
            <form method="get" th:action="@{/admin/users}" class="search-filter-form compact-filter-form">
                <div class="form-group">
                    <label class="form-label">Search</label>
                    <input class="form-input" name="q" th:value="${q}" placeholder="Name, email or phone" />
                </div>
                <div class="form-group">
                    <label class="form-label">Account Status</label>
                    <select class="form-select" name="status">
                        <option value="">All Statuses</option>
                        <option value="ACTIVE" th:selected="${statusFilter == 'ACTIVE'}">Active</option>
                        <option value="DISABLED" th:selected="${statusFilter == 'DISABLED'}">Disabled</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Stakeholder Role</label>
                    <select class="form-select" name="stakeholderRole">
                        <option value="">All Roles</option>
                        <option th:each="roleName : ${allStakeholderRoles}"
                                th:value="${roleName}" th:text="${roleName}"
                                th:selected="${roleName == stakeholderRoleFilter}"></option>
                    </select>
                </div>
                <div class="filter-actions">
                    <button type="submit" class="btn btn-primary">Search</button>
                    <a th:href="@{/admin/users}" class="btn btn-secondary">Clear</a>
                </div>
            </form>
        </div>
    </div>

    <div th:if="${users.isEmpty()}" class="empty-state">
        <div class="empty-state-icon">&#x1F465;</div>
        <p>No users registered yet.</p>
        <a th:href="@{/admin/users/add}" class="btn btn-primary">Add Your First User</a>
    </div>

    <div th:if="${!users.isEmpty()}" class="vehicle-grid">
        <article th:each="user : ${users}" class="vehicle-card">
            <div class="vc-body">
                <div class="flex items-center justify-between">
                    <p class="vc-plate" th:text="${user.name}">User Name</p>
                    <span class="badge" th:classappend="${user.role == 'ADMIN'} ? 'badge-info' : 'badge-neutral'" th:text="${user.role}">ROLE</span>
                </div>
                <p class="vc-model cell-muted" th:text="${user.email}">email@example.com</p>
                <p class="vc-meta" th:text="${user.phone}">Phone</p>
                <div class="flex items-center justify-between mt-2">
                    <span class="badge badge-neutral" th:if="${user.stakeholderRole}" th:text="${user.stakeholderRole}">STAKEHOLDER ROLE</span>
                    <span class="badge" th:classappend="${user.status == 'DISABLED'} ? 'badge-danger' : 'badge-success'" th:text="${user.status ?: 'ACTIVE'}">ACTIVE</span>
                </div>
                <div class="vc-actions">
                    <a th:href="@{/admin/users/edit/{id}(id=${user.userId})}" class="btn btn-primary btn-sm">Edit</a>
                    <form th:action="@{/admin/users/delete/{id}(id=${user.userId})}" method="post" class="delete-form">
                        <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                    </form>
                </div>
            </div>
        </article>
    </div>
</main>
</body>
</html>
