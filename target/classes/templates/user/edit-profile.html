<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>Edit Profile</title></head>
<body>
<main>
    <div class="card max-w-md mx-auto">
        <div class="card-header">
            <h4>Edit Profile</h4>
        </div>
        <div class="card-body">
            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
            <form th:action="@{/user/profile/update}" method="post">
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" name="name" th:value="${user.name}" required class="form-input" />
                </div>
                <div class="form-group">
                    <label class="form-label">Phone</label>
                    <input type="text" name="phone" th:value="${user.phone}" required pattern="[0-9]{10,15}" title="10 to 15 digits, numbers only (e.g. 0771234567)" class="form-input" />
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <a th:href="@{/user/profile}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
