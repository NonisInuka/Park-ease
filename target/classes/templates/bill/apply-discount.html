<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout/base :: layout(~{::title}, ~{::main})}"
>
  <head>
    <title>Apply Discount</title>
  </head>
  <body>
    <main>
      <div class="card max-w-lg mx-auto">
        <div class="card-header">
          <h4>Apply Discount</h4>
        </div>
        <div class="card-body">
          <p class="text-sm text-muted mb-3">
            <strong>Bill:</strong>
            <span class="font-mono" th:text="${bill.billId}"></span>
          </p>
          <p class="text-sm text-muted mb-4">
            <strong>Current Amount:</strong>
            <span
              class="font-semibold"
              th:text="'LKR ' + ${bill.finalAmount}"
            ></span>
          </p>
          <form th:action="@{/admin/bills/discount}" method="post">
            <input type="hidden" name="billId" th:value="${bill.billId}" />
            <div class="form-group">
              <label class="form-label">Discount Amount (LKR)</label>
              <input
                type="number"
                step="0.01"
                name="discount"
                required
                min="0"
                th:max="${bill.totalAmount}"
                placeholder="0.00"
                class="form-input"
              />
              <p
                class="form-hint"
                th:text="'Maximum: LKR ' + ${bill.totalAmount}"
              ></p>
            </div>
            <div class="form-actions">
              <button type="submit" class="btn btn-primary">
                Apply Discount
              </button>
              <a th:href="@{/admin/bills}" class="btn btn-secondary">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </main>
  </body>
</html>
