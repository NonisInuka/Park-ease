<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>Edit Slot</title></head>
<body><main>
<div class="card max-w-2xl mx-auto">
    <div class="card-header"><h4>Edit Parking Slot</h4></div>
    <div class="card-body">
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
        <form th:action="@{/admin/slots/update}" method="post">
            <input type="hidden" name="slotId" th:value="${slot.slotId}" />
            <div class="form-grid cols-2">
                <div class="form-group">
                    <label class="form-label">Slot Number</label>
                    <input type="text" name="slotNumber" th:value="${slot.slotNumber}" required maxlength="20" class="form-input" />
                </div>
                <div class="form-group">
                    <label class="form-label" for="facilitySelect">Facility</label>
                    <select id="facilitySelect" required class="form-select">
                        <option value="">Select Facility</option>
                        <option th:each="facility : ${facilities}"
                                th:value="${facility.facilityId}"
                                th:selected="${slot.facilityId == facility.facilityId}"
                                th:text="${facility.name}">Facility</option>
                    </select>
                    <p class="form-hint">Changing the facility filters the zone list below.</p>
                </div>
                <div class="form-group">
                    <label class="form-label" for="zoneSelect">Zone</label>
                    <select id="zoneSelect" name="zoneId" required class="form-select" th:data-current-zone="${slot.zoneId}">
                        <option value="">Select Zone</option>
                        <option th:each="z : ${zones}"
                                th:value="${z.zoneId}"
                                th:data-facility-id="${z.facilityId}"
                                th:selected="${slot.zoneId == z.zoneId}"
                                th:text="${z.name} + ' (' + ${z.floor} + ')'">Zone</option>
                    </select>
                    <p id="zoneHint" class="form-hint">Only zones from the selected facility are shown.</p>
                </div>
                <div class="form-group">
                    <label class="form-label">Allowed Vehicle Category</label>
                    <select name="type" required class="form-select">
                        <option th:each="category : ${vehicleCategories.entrySet()}"
                                th:value="${category.key}"
                                th:text="${category.value}"
                                th:selected="${slot.type == category.key}">Vehicle Category</option>
                    </select>
                    <p class="form-hint">Only vehicles in this category can reserve this slot.</p>
                </div>
                <div class="form-group">
                    <label class="form-label">Space Category</label>
                    <select name="spaceCategory" required class="form-select">
                        <option value="STANDARD" th:selected="${slot.spaceCategory == 'STANDARD'}">STANDARD</option>
                        <option value="ACCESSIBLE" th:selected="${slot.spaceCategory == 'ACCESSIBLE'}">ACCESSIBLE</option>
                        <option value="PREMIUM" th:selected="${slot.spaceCategory == 'PREMIUM'}">PREMIUM</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Status</label>
                    <select name="status" required class="form-select">
                        <option value="AVAILABLE" th:selected="${slot.status == 'AVAILABLE'}">AVAILABLE</option>
                        <option value="OCCUPIED" th:selected="${slot.status == 'OCCUPIED'}">OCCUPIED</option>
                        <option value="MAINTENANCE" th:selected="${slot.status == 'MAINTENANCE'}">MAINTENANCE</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Rate per Hour (LKR)</label>
                    <input type="number" step="0.01" name="ratePerHour" th:value="${slot.ratePerHour}" required min="0.01" max="10000" class="form-input" />
                </div>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Update Slot</button>
                <a th:href="@{/admin/slots}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
<script>
(function () {
    const facilitySelect = document.getElementById('facilitySelect');
    const zoneSelect = document.getElementById('zoneSelect');
    const zoneHint = document.getElementById('zoneHint');
    if (!facilitySelect || !zoneSelect) return;

    const zoneOptions = Array.from(zoneSelect.querySelectorAll('option[data-facility-id]'));
    const originalZoneId = zoneSelect.dataset.currentZone || '';
    let firstRun = true;

    function filterZones() {
        const facilityId = facilitySelect.value;
        let visibleCount = 0;

        zoneOptions.forEach(option => {
            const matches = facilityId && option.dataset.facilityId === facilityId;
            option.hidden = !matches;
            option.disabled = !matches;
            if (matches) visibleCount++;
        });

        zoneSelect.disabled = !facilityId || visibleCount === 0;
        zoneSelect.options[0].textContent = !facilityId
            ? 'Select a facility first'
            : visibleCount === 0 ? 'No zones available for this facility' : 'Select Zone';

        if (firstRun && originalZoneId) {
            const currentOption = zoneOptions.find(option => option.value === originalZoneId && !option.disabled);
            zoneSelect.value = currentOption ? originalZoneId : '';
        } else {
            const selected = zoneSelect.options[zoneSelect.selectedIndex];
            if (!selected || selected.disabled || selected.hidden || selected.dataset.facilityId !== facilityId) {
                zoneSelect.value = '';
            }
        }
        firstRun = false;

        if (zoneHint) {
            zoneHint.textContent = !facilityId
                ? 'Choose a facility first to view its zones.'
                : visibleCount === 0
                    ? 'This facility has no zones yet. Create a zone before moving this slot.'
                    : visibleCount + (visibleCount === 1 ? ' zone available in this facility.' : ' zones available in this facility.');
        }
    }

    facilitySelect.addEventListener('change', function () {
        firstRun = false;
        zoneSelect.value = '';
        filterZones();
    });
    filterZones();
})();
</script>
</main></body></html>
