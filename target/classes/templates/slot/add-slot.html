<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>Add Slot</title></head>
<body><main>
<div class="card max-w-2xl mx-auto">
    <div class="card-header"><h4>Add Parking Slot</h4></div>
    <div class="card-body">
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
        <div th:if="${zones.isEmpty()}" class="alert alert-error">
            Create a parking facility and zone before adding parking spaces.
            <a th:href="@{/admin/facilities}">Manage facilities</a>
        </div>
        <form th:if="${!zones.isEmpty()}" th:action="@{/admin/slots/add}" method="post">
            <div class="form-grid cols-2">
                <div class="form-group">
                    <label class="form-label">Slot Number</label>
                    <input type="text" name="slotNumber" required minlength="1" maxlength="20" placeholder="e.g. A-01" class="form-input" />
                </div>
                <div class="form-group">
                    <label class="form-label" for="facilitySelect">Facility</label>
                    <select id="facilitySelect" required class="form-select">
                        <option value="">Select Facility</option>
                        <option th:each="facility : ${facilities}"
                                th:value="${facility.facilityId}"
                                th:text="${facility.name}">Facility</option>
                    </select>
                    <p class="form-hint">Choose a facility first to filter its parking zones.</p>
                </div>
                <div class="form-group">
                    <label class="form-label" for="zoneSelect">Zone</label>
                    <select id="zoneSelect" name="zoneId" required class="form-select" disabled>
                        <option value="">Select a facility first</option>
                        <option th:each="z : ${zones}"
                                th:value="${z.zoneId}"
                                th:data-facility-id="${z.facilityId}"
                                th:data-floor="${z.floor}"
                                th:text="${z.name} + ' (' + ${z.floor} + ')'">Zone</option>
                    </select>
                    <p id="zoneHint" class="form-hint">Only zones from the selected facility will be shown.</p>
                </div>
                <div class="form-group">
                    <label class="form-label">Allowed Vehicle Category</label>
                    <select name="type" required class="form-select">
                        <option value="">Select Vehicle Category</option>
                        <option th:each="category : ${vehicleCategories.entrySet()}"
                                th:value="${category.key}"
                                th:text="${category.value}">Vehicle Category</option>
                    </select>
                    <p class="form-hint">Only vehicles in this category can reserve this slot.</p>
                </div>
                <div class="form-group">
                    <label class="form-label">Space Category</label>
                    <select name="spaceCategory" required class="form-select">
                        <option value="STANDARD">STANDARD</option>
                        <option value="ACCESSIBLE">ACCESSIBLE</option>
                        <option value="PREMIUM">PREMIUM</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Rate per Hour (LKR)</label>
                    <input type="number" step="0.01" name="ratePerHour" required min="0.01" max="10000" placeholder="0.00" class="form-input" />
                    <p class="form-hint">0.01 - 10000 LKR</p>
                </div>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Create Slot</button>
                <a th:href="@{/admin/slots}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
<script>
(function () {
    const facilitySelect = document.getElementById('facilitySelect');
    const zoneSelect = document.getElementById('zoneSelect');
    const zoneHint = document.getElementById('zoneHint');
    if (!facilitySelect || !zoneSelect) return;

    const zoneOptions = Array.from(zoneSelect.querySelectorAll('option[data-facility-id]'));

    function filterZones() {
        const facilityId = facilitySelect.value;
        zoneSelect.value = '';
        let visibleCount = 0;

        zoneOptions.forEach(option => {
            const matches = facilityId && option.dataset.facilityId === facilityId;
            option.hidden = !matches;
            option.disabled = !matches;
            if (matches) visibleCount++;
        });

        zoneSelect.disabled = !facilityId || visibleCount === 0;
        zoneSelect.options[0].textContent = !facilityId
            ? 'Select a facility first'
            : visibleCount === 0 ? 'No zones available for this facility' : 'Select Zone';

        if (zoneHint) {
            zoneHint.textContent = !facilityId
                ? 'Choose a facility first to view its zones.'
                : visibleCount === 0
                    ? 'This facility has no zones yet. Create a zone before adding a slot.'
                    : visibleCount + (visibleCount === 1 ? ' zone available in this facility.' : ' zones available in this facility.');
        }
    }

    facilitySelect.addEventListener('change', filterZones);
    filterZones();
})();
</script>
</main></body></html>
