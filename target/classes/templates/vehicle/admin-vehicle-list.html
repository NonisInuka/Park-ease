<!doctype html>
<html
    xmlns:th="http://www.thymeleaf.org"
    th:replace="~{layout/base :: layout(~{::title}, ~{::main})}"
>
    <head>
        <title>Vehicles</title>
    </head>
    <body>
        <main>
            <div class="page-header">
                <h3>
                    All Vehicles
                    <span
                        th:if="${!vehicles.isEmpty()}"
                        class="text-muted text-sm font-mono"
                        th:text="'(' + ${vehicles.size()} + ')'"
                    ></span>
                </h3>
            </div>

    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

            <div th:if="${vehicles.isEmpty()}" class="empty-state">
                <div class="empty-state-icon">&#x1F697;</div>
                <p>No vehicles registered.</p>
            </div>

            <div th:if="${!vehicles.isEmpty()}" class="vehicle-grid">
                <article th:each="vehicle : ${vehicles}" class="vehicle-card">
                    <div class="vc-image">
                        <img
                            th:if="${vehicle.vehicleUrl != null and !vehicle.vehicleUrl.isEmpty()}"
                            th:src="${vehicle.vehicleUrl}"
                            alt="Vehicle"
                        />
                        <div
                            th:if="${vehicle.vehicleUrl == null or vehicle.vehicleUrl.isEmpty()}"
                            class="vc-no-image"
                        >
                            No Image
                        </div>
                    </div>
                    <div class="vc-body">
                        <div class="flex items-center justify-between">
                            <p
                                class="vc-plate"
                                th:text="${vehicle.plateNumber}"
                            >
                                PLATE
                            </p>
                            <span
                                class="badge badge-info"
                                th:text="${vehicleCategoryLabels[vehicle.type] != null ? vehicleCategoryLabels[vehicle.type] : vehicle.type}"
                                >TYPE</span
                            >
                        </div>
                        <p
                            class="vc-model"
                            th:text="${vehicle.make} + ' ' + ${vehicle.model}"
                        >
                            Make Model
                        </p>
                        <p class="vc-meta">
                            Color: <span th:text="${vehicle.color}">—</span>
                        </p>
                        <div class="vc-owner">
                            <span>Owner</span>
                            <span class="owner-id" th:text="${vehicle.ownerId}"
                                >—</span
                            >
                        </div>
                        <div class="vc-actions">
                            <a
                                th:href="@{/admin/vehicles/edit/{id}(id=${vehicle.vehicleId})}"
                                class="btn btn-primary btn-sm"
                                >Edit</a
                            >
                            <form
                                th:action="@{/admin/vehicles/delete/{id}(id=${vehicle.vehicleId})}"
                                method="post"
                                class="delete-form"
                            >
                                <button
                                    type="submit"
                                    class="btn btn-danger btn-sm"
                                >
                                    Delete
                                </button>
                            </form>
                        </div>
                    </div>
                </article>
            </div>
        </main>
    </body>
</html>
